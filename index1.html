<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --error: #dc2626;
            --success: #16a34a;
            --border: #d1d5db;
            --bg: #f9fafb;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        .registration-container {
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h1 { margin-top: 0; font-size: 1.5rem; color: #111827; }
        form { display: flex; flex-direction: column; gap: 1.25rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.35rem; }
        label { font-weight: 500; font-size: 0.875rem; color: #374151; }
        input {
            padding: 0.625rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }
        input:invalid:not(:placeholder-shown) { border-color: var(--error); }
        input:valid:not(:placeholder-shown) { border-color: var(--success); }
        .error-msg {
            color: var(--error);
            font-size: 0.75rem;
            min-height: 1rem;
            display: none;
        }
        button {
            background: var(--primary);
            color: #fff;
            padding: 0.75rem;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: var(--primary-hover); }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
    </style>
</head>
<body>
    <main class="registration-container">
        <h1>Create Account</h1>
        <form id="registrationForm" action="/api/register" method="POST" novalidate>
            <!-- CSRF Token Placeholder (Backend should inject this) -->
            <input type="hidden" name="_csrf" value="{{csrf_token}}">

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required minlength="3" maxlength="20" 
                       pattern="^[a-zA-Z0-9_]+$" autocomplete="username" placeholder="e.g., john_doe">
                <span class="error-msg" id="usernameError">3-20 alphanumeric characters or underscores only.</span>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
                <span class="error-msg" id="emailError">Please enter a valid email address.</span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="8" 
                       autocomplete="new-password" placeholder="Minimum 8 characters">
                <span class="error-msg" id="passwordError">Password must be at least 8 characters.</span>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required 
                       autocomplete="new-password" placeholder="Re-enter password">
                <span class="error-msg" id="confirmPasswordError">Passwords do not match.</span>
            </div>

            <button type="submit" id="submitBtn">Register</button>
        </form>
    </main>

    <script>
        (function() {
            const form = document.getElementById('registrationForm');
            const passwordInput = document.getElementById('password');
            const confirmInput = document.getElementById('confirmPassword');
            const confirmError = document.getElementById('confirmPasswordError');
            const submitBtn = document.getElementById('submitBtn');

            // Real-time password match validation
            function validatePasswordMatch() {
                if (confirmInput.value && passwordInput.value !== confirmInput.value) {
                    confirmInput.setCustomValidity('Passwords do not match');
                    confirmError.style.display = 'block';
                } else {
                    confirmInput.setCustomValidity('');
                    confirmError.style.display = 'none';
                }
            }

            passwordInput.addEventListener('input', validatePasswordMatch);
            confirmInput.addEventListener('input', validatePasswordMatch);

            form.addEventListener('submit', function(e) {
                validatePasswordMatch();
                
                if (!form.checkValidity()) {
                    e.preventDefault();
                    // Trigger native browser validation UI
                    form.reportValidity();
                    return;
                }

                // Disable button to prevent double submission
                submitBtn.disabled = true;
                submitBtn.textContent = 'Registering...';
            });
        })();
    </script>
</body>
</html>
